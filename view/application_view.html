<!DOCTYPE html>
<html lang="ru">
<head>
    <meta  name="viewport"  content="width=device-width, initial-scale=0.7, viewport-fit=cover" />
    <meta charset="UTF-8">
    <title>Просмотр заявки</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .modal {
            background: #fff;
            border-radius: 10px;
            padding: 30px;
            width: 600px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            position: relative;
        }
        .modal h2 {
            margin-top: 0;
        }
        .form-group {
            margin-bottom: 20px;
        }
        input, textarea {
            width: 96%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 14px;
        }
        .submit-btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 15px;
        }
        .close {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 24px;
            cursor: pointer;
        }
        .status-controls button {
            margin-right: 10px;
            padding: 10px 16px;
            border: 1px solid #aaa;
            border-radius: 6px;
            background: #f4f4f4;
            cursor: pointer;
        }
        .status-controls button.active {
            background-color: #28a745;
            color: white;
            cursor: default;
        }
        .download button{
            margin-right: 10px;
            padding: 10px 16px;
            border: 1px solid #aaa;
            border-radius: 6px;
            background: #f4f4f4;
            cursor: pointer;
        }
        .download button.active{
            background-color: #28a745;
            color: white;
            cursor: default;
        }

        #previewContainer {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .preview-item {
            position: relative;
            width: 100px;
        }

        .preview-item img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #ccc;
            cursor: pointer;
        }

        .preview-name {
            margin-top: 4px;
            font-size: 11px;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .image-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.8);
            z-index: 9999;
        }

        .image-modal img {
            max-width: 90%;
            max-height: 90%;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        .close-preview {
            position: absolute;
            right: 25px;
            top: 15px;
            color: white;
            font-size: 40px;
            cursor: pointer;
        }

        .nav-btn {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            font-size: 40px;
            border: none;
            background: rgba(0,0,0,.4);
            color: white;
            cursor: pointer;
            padding: 15px;
            border-radius: 8px;
        }

        .left {
            left: 30px;
        }

        .right {
            right: 30px;
        }
    </style>
</head>
<body>
<div class="modal">
    <span class="close" onclick="window.location.href='/main'">&times;</span>
    <h2>Заявка системному администратору</h2>
    <div class="form-group">
        <label>Название:</label>
        <input type="text" id="title" disabled>
    </div>
    <div class="form-group">
        <label>Кабинет:</label>
        <input type="text" id="cabinet" disabled>
    </div>
    <div class="form-group">
        <label>Описание:</label>
        <textarea id="description" rows="3" disabled style="min-height: 20px; max-height: 210px; max-width: 96%; min-width: 96%;"></textarea>
    </div>
    <div class="form-group" id="photo-section" style="display:none;">
        <label>Фотографии:</label>

        <div id="previewContainer"></div>

        <div id="imageModal" class="image-modal">
            <span class="close-preview">&times;</span>
            <img id="fullImage">
            <button class="nav-btn left" onclick="prevImage()">❮</button>
            <button class="nav-btn right" onclick="nextImage()">❯</button>
        </div>
    </div>
    <div class="form-group" style="display: flex; flex-direction: row; flex-wrap: nowrap; margin-bottom: 0px">
        <div class="form-group">
            <label>Дата подачи:</label>
            <input type="text" id="date_submission" style="width: 90%;" disabled>
        </div>
        <div class="form-group">
            <label>Дата завершения:</label>
            <input type="text" id="date_completion" style="width: 92%;" disabled>
        </div>
    </div>
    <div class="form-group">
        <label>Приоритет:</label>
        <input type="text" id="priority" disabled>
    </div>
    <div class="form-group">
        <label>Текущий статус:</label>
        <input type="text" id="status" disabled>
    </div>
    <div style="display: flex; flex-direction: row-reverse; justify-content: space-between; align-items: center;">
        <div class="form-group status-controls" style="margin-top: 33px; justify-self: end;">
            <button onclick="downloadDocx()"
                    style="margin-right: 10px; padding: 10px 16px; border: 1px solid #aaa; border-radius: 6px; background: #f4f4f4; cursor: pointer;">
                Скачать заявку
            </button>
        </div>
        <div class="form-group status-controls" id="admin-controls" style="display:none">
            <label>Изменить статус:</label><br>
            <div id="status-buttons" style="margin-top: 15px;"></div>
        </div>
    </div>
</div>
<script>
    const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get('id');
    let currentImageIndex = 0;
    let applicationFiles = [];

    const statuses = ['Новая', 'В работе', 'Завершена'];

    async function loadApplication() {
        const userRes = await fetch("/me");
        const currentUser = await userRes.json();
        const isAdmin = currentUser.is_admin;

        const res = await fetch(`/applications/${id}`);
        const data = await res.json();

        document.getElementById('title').value = data.title;
        document.getElementById('cabinet').value = data.cabinet_number;
        document.getElementById('description').value = data.problem_description;
        document.getElementById('date_submission').value = data.date_submission;
        document.getElementById('date_completion').value = data.date_completion;
        document.getElementById('priority').value = ['Низкий', 'Средний', 'Высокий'][data.id_priority - 1];
        document.getElementById('status').value = statuses[data.id_status - 1];

        if (isAdmin && data.id_status < 3) {
            const container = document.getElementById("status-buttons");
            statuses.forEach((name, index) => {
                const statusIndex = index + 1;
                if (data.id_status === 2 && statusIndex === 1) return;
                const btn = document.createElement("button");
                btn.textContent = name;
                if (statusIndex === data.id_status) {
                    btn.classList.add("active");
                } else {
                    btn.onclick = () => changeStatus(statusIndex);
                }
                container.appendChild(btn);
            });
            document.getElementById('admin-controls').style.display = 'block';
        }
        applicationFiles = data.files || [];

        if (applicationFiles.length > 0) {
            document.getElementById("photo-section").style.display = "block";

            const container = document.getElementById("previewContainer");
            container.innerHTML = "";

            applicationFiles.forEach((file, index) => {
                const div = document.createElement("div");

                div.className = "preview-item";

                div.innerHTML = `
                    <img src="${file.url}" onclick="showImage(${index})" title="${file.name}">
                    <div class="preview-name">${file.name}</div>
                `;

                container.appendChild(div);
            });
        }
    }
    loadApplication();

    function downloadDocx() {
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');
        window.location.href = `/applications/${id}/export`;
    }

    function changeStatus(newStatus) {
        fetch(`/applications/${id}/status`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ new_status: newStatus})
        })
        .then(res => res.json())
        .then(() => window.location.reload());
    }

    function showImage(index) {
        currentImageIndex = index;

        document.getElementById("fullImage").src =
            applicationFiles[currentImageIndex].url;

        document.getElementById("imageModal").style.display = "block";
    }

    function prevImage() {
        currentImageIndex--;

        if (currentImageIndex < 0) {
            currentImageIndex = applicationFiles.length - 1;
        }

        document.getElementById("fullImage").src =
            applicationFiles[currentImageIndex].url;
    }

    function nextImage() {
        currentImageIndex++;

        if (currentImageIndex >= applicationFiles.length) {
            currentImageIndex = 0;
        }

        document.getElementById("fullImage").src =
            applicationFiles[currentImageIndex].url;
    }

    document.querySelector(".close-preview").onclick = () => {
        document.getElementById("imageModal").style.display = "none";
    };

    document.getElementById("imageModal").onclick = (e) => {
        if (e.target.id === "imageModal") {
            document.getElementById("imageModal").style.display = "none";
        }
    };

    document.addEventListener("keydown", (e) => {
        if (document.getElementById("imageModal").style.display !== "block") {
            return;
        }
        if (e.key === "ArrowLeft") {
            prevImage();
        }
        if (e.key === "ArrowRight") {
            nextImage();
        }
        if (e.key === "Escape") {
            document.getElementById("imageModal").style.display = "none";
        }
    });

</script>
</body>
</html>
